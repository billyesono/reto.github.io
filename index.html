<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirigiendo...</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #f0f2f5;
            font-family: sans-serif;
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 5px solid #e0e0e0;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h2 { color: #333; }
    </style>
</head>
<body>

    <div class="loader"></div>
    <h2>Preparando redirección...</h2>

    <script>
        // Configuración
        const urlDestino = "https://cut-sustainer-reassure.ngrok-free.dev/geturistas/"; // <--- CAMBIA ESTO POR TU ENLACE
        const tiempoEspera = 3000; // 3000 milisegundos = 3 segundos

        // Ejecutar redirección
        setTimeout(() => {
            window.location.href = urlDestino;
        }, tiempoEspera);
    </script>

</body>
</html>
